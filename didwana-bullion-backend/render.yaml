databases:
  - name: didwana-bullion-db
    databaseName: didwana_bullion
    user: didwana_bullion_user
    plan: free

services:
  - type: web
    name: didwana-bullion-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: didwana-bullion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RATES_UPSTREAM_URL
        value: https://glimmr-jewellry-e-commerce-platform-5.onrender.com
